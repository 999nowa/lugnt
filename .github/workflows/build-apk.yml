name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to repository
        run: |
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/lugnt-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build/outputs/apk/debug/lugnt-debug.apk
          git diff --cached --quiet || git commit -m "Add latest lugnt-debug.apk"
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lugnt-debug-apk
          path: app/build/outputs/apk/debug/lugnt-debug.apk
