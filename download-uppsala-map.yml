name: Hämta Uppsala kartdata

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta vägnät från Uppsala kommun
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kartportal.uppsala.se/integrations/rest/services/ByggR/Bakgrundskarta_ByggR/MapServer/644/query'
          mkdir -p data
          offset=0
          : > data/features.ndjson
          while true; do
            curl --fail --silent --show-error --get "$BASE" --data-urlencode 'where=1=1' --data-urlencode 'outFields=*' --data-urlencode 'returnGeometry=true' --data-urlencode 'outSR=4326' --data-urlencode 'f=geojson' --data-urlencode "resultOffset=$offset" --data-urlencode 'resultRecordCount=2000' -o page.json
            count=$(jq '.features | length' page.json)
            echo "Hämtade $count objekt från offset $offset"
            jq -c '.features[]' page.json >> data/features.ndjson
            [ "$count" -lt 2000 ] && break
            offset=$((offset + count))
          done
          jq -s '{type:"FeatureCollection",features:.}' data/features.ndjson > data/uppsala_vagar.geojson
          echo "Totalt: $(jq '.features|length' data/uppsala_vagar.geojson) vägar"
          ls -lh data/uppsala_vagar.geojson
      - name: Ladda upp GeoJSON
        uses: actions/upload-artifact@v4
        with:
          name: uppsala-kartdata
          path: data/uppsala_vagar.geojson
          retention-days: 30
